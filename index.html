etorial e cônicas.\n\nTÓPICOS DA DISCIPLINA\n\n1. Vetores\n2. Matrizes\n3. Determinantes, matriz inversa e matriz ortogonal\n4. Sistemas de equações lineares\n5. Métodos LU e Gauss-Jordan, sistemas homogêneos e regra de Cramer\n6. Espaços vetoriais\n7. Base, conjunto gerador e mudança de base\n8. Transformações lineares\n9. Autovetores, autovalores e diagonalização\n10. Reta no plano: função linear e equação da reta\n11. Reta: formas canônica e paramétrica, posições relativas\n12. Produto vetorial, produto misto e plano\n13. Cônicas\n14. Prova","Bibliografia_x003a_":"Winterle, P. Vetores e Geometria Analítica. Pearson.\nSauro, H. Introduction to Linear Algebra for Systems Biology.","Pré-requisitos_x003a_ ":"Não há","Observações para a disciplina_x003a_ ":"Aulas teórico-práticas em regime presencial","Início da Disciplina_x003a_ ":"46461","Término da Disciplina_x003a_ ":"46510","Dia e horário das aulas_x002e_Segunda":"09h às 12h","Dia e horário das aulas_x002e_Terça":"Dia sem aula","Dia e horário das aulas_x002e_Quarta":"09h às 12h","Dia e horário das aulas_x002e_Quinta":"Dia sem aula","Dia e horário das aulas_x002e_Sexta":"Dia sem aula","Observação sobre o horário_x003a_":"","Informe a metodologia da disciplina_x003a_ ":"Presencial","Carga horária_x003a_":"42","Número de créditos_x003a_ ":"1","Número de encontros/aulas_x003a_ ":"14","Número total de vagas_x003a_ ":"15","Caso o número de inscritos ultrapasse o número de vagas, informe os critérios de seleção_x003a_ ":"Ordem de Inscrição"},{"@odata.etag":"","ItemInternalId":"75200e4e-08fd-4aa8-a6ab-4a092d679cb5","Nome completo do Coordenador da disciplina_x003a_":"Rosana Gentile","Programa de Pós-Graduação ao qual o Coordenador da Disciplina está vinculado_x003a_":"Biodiversidade e Saúde (BS)","Tipo de Disciplina_x003a_ ":"Eletiva","Informe o nome da disciplina_x003a_ ":"Ecologia Parasitária","Ementa_x003a_":"","Bibliografia_x003a_":"","Pré-requisitos_x003a_ ":"Não tem.","Observações para a disciplina_x003a_ ":"Mínimo
